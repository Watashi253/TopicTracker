version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: topic_tracker_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: topic_tracker_redis
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: topic_tracker_api
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  worker:
    build: .
    container_name: topic_tracker_worker
    command: celery -A src.worker.celery_app worker --loglevel=info -P solo -Q extraction
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  postgres_data: