services:
  db:
    image: pgvector/pgvector:pg16
    container_name: topic_tracker_db
    restart: always
    env_file: .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: topic_tracker_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: