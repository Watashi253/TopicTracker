services:
  redis:
    image: redis:alpine
    container_name: topic_tracker_redis
    ports:
      - "6379:6379"

  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: always
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

  api:
    build: .
    container_name: topic_tracker_api
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis

  worker:
    build: .
    container_name: topic_tracker_worker
    command: celery -A src.worker.celery_app worker --loglevel=info --pool=prefork --concurrency=${CELERY_CONCURRENCY:-4} -Q extraction
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      TOKENIZERS_PARALLELISM: "true"
    depends_on:
      - redis