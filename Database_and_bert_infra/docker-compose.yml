services:
  redis:
    image: redis:alpine
    container_name: topic_tracker_redis
    ports:
      - "6379:6379"

  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: always
    environment:
      - REDIS_HOSTS=local:topic_tracker_redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

  api:
    build: .
    container_name: topic_tracker_api
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis

  # 1. The Heavy Lifter: Handles BERT and Scraping
  worker-extraction:
    build: .
    container_name: topic_tracker_extraction_worker
    command: celery -A src.worker.celery_app worker --loglevel=info --pool=prefork --concurrency=${CELERY_CONCURRENCY:-1} -Q extraction
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      TOKENIZERS_PARALLELISM: "true"
      C_FORCE_ROOT: "true"
    depends_on:
      - redis

  # 2. The Maintenance Pool: Handles SMTP Nudges and DB Purging
  # This stays lightweight so it doesn't fight with BERT for RAM
  worker-maintenance:
    build: .
    container_name: topic_tracker_maintenance_worker
    command: celery -A src.worker.celery_app worker --loglevel=info -Q maintenance -c 1
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis

  # 3. The Clock: Triggers the daily purge every 24 hours
  celery-beat:
    build: .
    container_name: topic_tracker_beat
    command: celery -A src.worker.celery_app beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis