services:
  redis:
    image: redis:7-alpine
    container_name: topic_tracker_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - topic_tracker


  ingestion-api:
    build: ./Data_Ingestion
    image: topic_tracker_ingestion_base
    container_name: ingestion_api
    ports:
      - "8002:8002"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - topic_tracker
    restart: unless-stopped

  ingestion-worker:
    image: topic_tracker_ingestion_base
    container_name: ingestion_worker
    command: >
      celery -A app.tasks worker
        --loglevel=info
        --concurrency=1
        -Q reuters,bbc,ap,aljazeera,twitter,gdelt,reddit
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      ingestion-api:
        condition: service_started
    networks:
      - topic_tracker
    restart: unless-stopped

  ingestion-beat:
    image: topic_tracker_ingestion_base
    container_name: ingestion_beat
    command: >
      celery -A app.tasks beat
        --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      ingestion-api:
        condition: service_started
    networks:
      - topic_tracker
    restart: unless-stopped


  db-api:
    build: ./Database_and_bert_infra
    image: topic_tracker_base_worker
    container_name: topic_tracker_api
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - ./Database_and_bert_infra/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - INGESTION_BASE_URL=http://ingestion-api:8002
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - topic_tracker
    restart: unless-stopped

  db-worker:
    image: topic_tracker_base_worker
    container_name: topic_tracker_worker
    command: >
      celery -A src.worker.celery_app worker
        --loglevel=info
        --pool=prefork
        --concurrency=1
        -Q extraction,maintenance
    env_file:
      - ./Database_and_bert_infra/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - HF_HUB_ENABLE_HF_TRANSFER=1
      - TOKENIZERS_PARALLELISM=false
    depends_on:
      redis:
        condition: service_healthy
      db-api:
        condition: service_started
    networks:
      - topic_tracker
    restart: unless-stopped

  summarizer-worker:
    build: ./Bart_Summarisation/news-pipeline
    image: topic_tracker_summarizer_base
    container_name: topic_tracker_summarizer_worker
    env_file:
      - ./Bart_Summarisation/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - topic_tracker
    restart: unless-stopped

  frontend:
    build: 
      context: ./Application/frontend
      dockerfile: Dockerfile
    container_name: topic_tracker_frontend
    ports:
      - "3000:3000"
    env_file:
      - ./Application/frontend/.env
    environment:
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=topic_tracker_nextauth_secret_local_dev_2024
      # Route via Docker internal network for Server-Side proxying
      - NEXT_PUBLIC_API_URL=http://db-api:8000
      - DATA_INGESTION_URL=http://ingestion-api:8002
    depends_on:
      - db-api
    networks:
      - topic_tracker
    restart: unless-stopped

volumes:
  redis_data:

networks:
  topic_tracker:
    driver: bridge
